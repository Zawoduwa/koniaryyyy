<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><title>Dla Ciebie ❤</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1a0b14;--card:#2b1422;--ink:#ffe9f1;--pink:#ff4f8b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;text-align:center}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:2rem;margin:.3em 0;color:var(--pink)}h2{color:var(--pink);margin-top:2em}
canvas{width:100%;height:380px;display:block}
p{line-height:1.6;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:800px}
.card{aspect-ratio:3/4;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;border-radius:10px}
.card.f,.card.m{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;overflow:hidden}
.back{background:linear-gradient(135deg,#ff4f8b,#a3124f);display:flex;align-items:center;justify-content:center;font-size:2rem}
.front{transform:rotateY(180deg)}.front img{width:100%;height:100%;object-fit:cover}
.card.m .front{box-shadow:0 0 0 3px var(--pink) inset}
.btn{background:var(--pink);color:#fff;border:0;border-radius:99px;padding:10px 22px;font-size:1rem;margin-top:12px}
#win{min-height:2em;color:var(--pink);font-size:1.2rem}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.gal img{height:300px;border-radius:12px;scroll-snap-align:center}
.lv{background:#4a2238;margin:4px 2px}.lv.on{background:var(--pink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--pink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.4s;pointer-events:none;max-width:90%}
#toast.s{opacity:1;transform:translate(-50%,0)}
.hz{position:fixed;top:-30px;font-size:24px;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.6}}
</style></head><body><main>
<canvas id="c"></canvas>
<h1>Dla Ciebie, <span id="n"></span> ❤</h1>
<p id="msg"></p>
<h2>Memory z nami 💕</h2>
<p>Znajdź pary zdjęć. Wybierz poziom:</p>
<div><button class="btn lv" onclick="lvl(4,this)">Łatwy</button> <button class="btn lv on" onclick="lvl(6,this)">Średni</button> <button class="btn lv" onclick="lvl(8,this)">Trudny</button></div>
<p>Ruchy: <b id="mv">0</b> · Czas: <b id="tm">0</b>s · Rekord: <b id="bs">–</b></p>

<div class="grid" id="g"></div><div id="win"></div>
<button class="btn" onclick="init()">Zagraj jeszcze raz</button><div id="toast"></div>
<h2>Nasze zdjęcia</h2><div class="gal" id="gal"></div>
<p style="margin-top:2em">Kocham Cię ❤</p>
</main>

// memory
let first=null,lock=false,moves=0,found=0,pairs=6,sec=0,tmr=null,started=false;
const LOVE=["Kocham Cię ❤","Jesteś najlepsza 💖","Ten uśmiech 😍","Moja ulubiona osoba","Razem jest najlepiej 💕","Tęsknię, gdy Cię nie ma","Jesteś moim światem 🌍","Dziękuję, że jesteś"];
function bst(){try{return JSON.parse(localStorage.getItem('best')||'{}')}catch(e){return{}}}
function showBest(){const v=bst()[pairs];bs.textContent=v?v+' ruchów':'–'}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('s');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('s'),1400)}
function lvl(n,btn){pairs=n;document.querySelectorAll('.lv').forEach(x=>x.classList.toggle('on',x===btn));init()}
function hearts(){for(let i=0;i<40;i++){const s=document.createElement('span');s.className='hz';s.textContent=['❤','💖','🌹','💕'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}

function init(){clearInterval(tmr);started=false;sec=0;tm.textContent=0;const g=document.getElementById('g');g.innerHTML='';moves=0;found=0;first=null;lock=false;
mv.textContent=0;win.textContent='';showBest();
const pick=IMGS.map((s,k)=>({s,k,r:Math.random()})).sort((a,b)=>a.r-b.r).slice(0,pairs);
const deck=[...pick,...pick].map(d=>({...d,r:Math.random()})).sort((a,b)=>a.r-b.r);
deck.forEach(d=>{const c=document.createElement('div');c.className='card';c.dataset.k=d.k;
c.innerHTML='<div class="face back">❤</div><div class="face front"><img src="'+d.s+'"></div>';
c.onclick=()=>{if(lock||c.classList.contains('f')||c.classList.contains('m'))return;
if(!started){started=true;tmr=setInterval(()=>{tm.textContent=++sec},1000)}
c.classList.add('f');if(!first){first=c;return}moves++;mv.textContent=moves;
if(first.dataset.k===c.dataset.k){first.classList.add('m');c.classList.add('m');first=null;toast(LOVE[Math.floor(Math.random()*LOVE.length)]);
if(++found===pairs){clearInterval(tmr);const b=bst();let rec='';if(!b[pairs]||moves<b[pairs]){b[pairs]=moves;try{localStorage.setItem('best',JSON.stringify(b))}catch(e){}rec=' Nowy rekord! 🏆';showBest()}
win.textContent='Brawo! '+moves+' ruchów w '+sec+' s 💖'+rec;hearts()}}
else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove('f');c.classList.remove('f');lock=false},800)}};
g.appendChild(c)})}
init();
// bouquet
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;
function size(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
const R=[[-.6,.52,.2,345],[.6,.52,.2,350],[-.3,.78,.23,340],[.3,.78,.23,355],[0,.95,.27,348],[-.85,.3,.17,0],[.85,.3,.17,335],[-.12,.55,.2,5],[.15,.62,.18,330]];
const ez=t=>1-Math.pow(1-Math.min(Math.max(t,0),1),3);
function rose(x,y,r,h,t){ctx.save();ctx.translate(x,y);ctx.scale(t,t);
for(let i=0;i<5;i++){const rr=r*(1-i*.16);ctx.fillStyle=`hsl(${h},78%,${30+i*6}%)`;ctx.strokeStyle='rgba(0,0,0,.25)';
for(let j=0;j<5;j++){const a=(j*72+i*36)*Math.PI/180;ctx.save();ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,-rr*.38,rr*.5,rr*.62,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}}
ctx.strokeStyle='rgba(60,0,20,.6)';ctx.lineWidth=1.5;ctx.beginPath();for(let a=0;a<12;a+=.2){const q=a*r*.012;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q)}ctx.stroke();ctx.restore()}
const t0=performance.now();
function draw(now){const T=now-t0;ctx.clearRect(0,0,W,H);const bx=W/2,by=H-20,S=Math.min(W,420)*.95;
const pos=R.map((q,i)=>{const sw=Math.sin(T/1200+i)*.02;const a=Math.asin(q[0])*.9+sw;const len=q[1]*H*.8;
const g=ez((T-i*300)/1000);return{x:bx+Math.sin(a)*len*(.35+.65*g)*1.0,y:by-Math.cos(a)*len*g,g,r:q[2]*S*.62,h:q[3]}});
ctx.lineCap='round';pos.forEach(p=>{ctx.strokeStyle='#2f7d3a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx,(by+p.y)/2,p.x,p.y);ctx.stroke();
if(p.g>.5){ctx.fillStyle='#3c9a48';const mx=(bx+p.x)/2,my=(by+p.y)/2+10;ctx.beginPath();ctx.ellipse(mx+10,my,14,6,-.6,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(mx-10,my+12,14,6,.6,0,7);ctx.fill()}});
ctx.fillStyle='#ff4f8b';ctx.beginPath();ctx.moveTo(bx-30,by-25);ctx.lineTo(bx,by-12);ctx.lineTo(bx+30,by-25);ctx.lineTo(bx+22,by+2);ctx.lineTo(bx,by-8);ctx.lineTo(bx-22,by+2);ctx.fill();
[...pos].sort((a,b)=>a.y-b.y).forEach(p=>{if(p.g>0)rose(p.x,p.y,p.r,p.h,p.g)});
requestAnimationFrame(draw)}
requestAnimationFrame(draw);
